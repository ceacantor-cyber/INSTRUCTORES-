services:
  - type: web
    name: cea-cantor-evaluaciones
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack pnpm@10.18.0 install --frozen-lockfile && corepack pnpm@10.18.0 build
startCommand: corepack pnpm@10.18.0 db:migrate && corepack pnpm@10.18.0 start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: "5"
